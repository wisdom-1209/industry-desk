name: Build WISDOM install icons
on:
  push:
    paths:
      - 'icons/wisdom.svg'
      - '.github/workflows/build-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate PNG icons from WISDOM vector
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url="icons/wisdom.svg",write_to=f"icons/wisdom-{size}.png",output_width=size,output_height=size)
          PY
      - name: Commit PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/wisdom-192.png icons/wisdom-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate mobile app icons"
            git push
          fi
